<!DOCTYPE html>
<html lang="{{ lang|lower }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t.success_title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f5f6f8; }
        .prize-wrap { max-width: 560px; margin: 0 auto; padding: 32px 12px; }
        .prize-card { background: #fff; border-radius: 12px; padding: 28px 22px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
        .check { font-size: 3.5rem; color: #198754; line-height: 1; }
    </style>
</head>
<body>
<div class="prize-wrap">
    <div class="prize-card">
        <div class="check"><i class="bi bi-check-circle-fill"></i></div>
        <h1 class="h4 mt-3 mb-2">{{ t.success_title }}</h1>
        <p class="text-muted mb-1">{{ t.success_msg }}</p>

        <hr class="my-4">

        <p class="small text-muted mb-3">{{ t.success_edit }}</p>
        <a href="{{ url_for('prize.player_form', token=p.token, lang=lang) }}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-pencil-square"></i> {{ t.save_changes }}
        </a>
    </div>

    <p class="text-muted small text-center mt-3 mb-0">
        <i class="bi bi-shield-lock"></i> {{ t.privacy_note }}
    </p>
</div>
</body>
</html>
