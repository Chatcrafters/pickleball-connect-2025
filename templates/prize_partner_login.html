<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Prize Money - Sign in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: #f5f6f8; }
        .login-wrap { max-width: 420px; margin: 0 auto; padding: 48px 14px; }
        .login-card { background: #fff; border-radius: 12px; padding: 26px 22px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .login-icon { font-size: 2.4rem; color: #198754; line-height: 1; }
        .login-card .form-control { min-height: 48px; }
        .login-card .btn { min-height: 48px; font-weight: 700; }
    </style>
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="login-icon"><i class="bi bi-bank"></i></div>
            <h1 class="h5 mt-2 mb-1">Prize Money</h1>
            <div class="text-muted small">WPC Alba 2026</div>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">
            <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('prize.partner_login') }}">
            <div class="mb-3">
                <label class="form-label" for="access_code">Access code</label>
                <input type="password" class="form-control" id="access_code" name="access_code"
                       autocomplete="current-password" required autofocus>
            </div>
            <button type="submit" class="btn btn-success w-100">
                <i class="bi bi-box-arrow-in-right"></i> Sign in
            </button>
        </form>
    </div>

    <p class="text-muted small text-center mt-3 mb-0">
        <i class="bi bi-shield-lock"></i> Confidential - contains bank details.
    </p>
</div>
</body>
</html>
